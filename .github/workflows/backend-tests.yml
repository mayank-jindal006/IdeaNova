name: Backend tests

on:
  push:
    branches: [integration, phase4-auth-ci]
  pull_request:
    branches: [integration]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run real ASGI authentication and tenant-isolation tests
        run: python -m pytest tests/test_auth_asgi.py -q --disable-warnings --maxfail=1
      - name: Run complete backend test suite
        run: python -m pytest tests -q --disable-warnings --maxfail=1
